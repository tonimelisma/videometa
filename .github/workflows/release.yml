name: Release

on:
  push:
    branches: [main]

jobs:
  hosted-release-verify:
    name: hosted-release-verify
    runs-on: ubuntu-latest
    env:
      VIDEOMETA_REQUIRE_LOCAL_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install formatting tools
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          go install golang.org/x/tools/cmd/goimports@v0.43.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Install exiftool
        run: ./scripts/setup-exiftool.sh

      - name: Cache bootstrap fixtures
        uses: actions/cache@v4
        with:
          path: |
            testdata/gopro_action.mp4
            testdata/dji_inspire3_car_4k120_rec709.mov
            testdata/dji_ronin4d_4k_prores4444_25fps.mov
          key: ${{ runner.os }}-bootstrap-fixtures-${{ hashFiles('scripts/fixture_bootstrap.tsv') }}

      - name: Restore validated fixture corpus
        run: ./scripts/check-local-fixtures.sh

      - name: Validate release bump and notes
        run: ./scripts/check-release-guard.sh

      - name: Check formatting
        run: ./scripts/check-format.sh

      - name: Lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test -race -coverprofile=cover.out ./...

      - name: Coverage
        run: go tool cover -func=cover.out | grep total

      - name: Validate golden files
        run: |
          go generate ./gen
          git diff --exit-code -- testdata/*.exiftool.json testdata/*.exiftool.ordered.json

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: hosted-release-verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          notes_file="docs/releases/${version}.md"

          git fetch --tags --force origin
          if git rev-parse "${version}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "release tag ${version} already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${version}" -m "Release ${version}" "${GITHUB_SHA}"
          git push origin "${version}"

          gh release create "${version}" \
            --title "${version}" \
            --notes-file "${notes_file}" \
            --target "${GITHUB_SHA}"
